# Local Postgres for development. Not a deployment artifact — production runs
# on a managed database (Neon or Supabase), see .env.example.
#
#   docker compose up -d --wait     start, block until the healthcheck passes
#   docker compose stop             stop, keep the data
#   docker compose down -v          stop and DESTROY the data volume
#
# Step by step: docs/POSTGRES-DOCKER.md
services:
  db:
    # Any Postgres >= 14 runs this schema. Change the tag to whichever image
    # you already pulled — `docker image ls postgres` shows it.
    image: postgres:18-alpine
    container_name: secreto-postgres
    restart: unless-stopped
    environment:
      # Development credentials, deliberately literal: this database holds demo
      # catalog data and is never reachable from outside the machine. Real
      # credentials live in .env, which is git-ignored.
      # These three only take effect the FIRST time the volume is initialized.
      POSTGRES_USER: secreto
      POSTGRES_PASSWORD: secreto
      POSTGRES_DB: secreto_dev
    ports:
      # host:container — if 5432 is already taken by a local Postgres, change
      # the left side to 5433 and update the port in DATABASE_URL to match.
      - "5432:5432"
    volumes:
      - secreto_pgdata:/var/lib/postgresql/data
    healthcheck:
      # `docker compose up --wait` and `depends_on: service_healthy` both key
      # off this — the container accepts connections a moment after it starts.
      test: ["CMD-SHELL", "pg_isready -U secreto -d secreto_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  secreto_pgdata:
